# Continuous integration for the Motivo Stateflow workspace.
#
# Verifies linting, compile-time tests, the runtime suite, coverage thresholds and the production
# build on Linux and Windows across the supported Node.js versions (22, 24 and 26, per the Node
# release schedule), then consumes the built package the way a downstream project would: once as a
# local smoke test, and once per TypeScript version from the documented floor to the latest release.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    name: Node ${{ matrix.node }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [22, 24, 26]

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Type check
        run: pnpm --filter motivo-stateflow run test:typecheck

      - name: Test
        run: pnpm --filter motivo-stateflow run test:unit

      # Coverage is measured on one configuration: the tally depends on the provider and the
      # runtime, so a single authoritative run keeps the gate meaningful instead of version specific.
      - name: Check coverage thresholds
        if: matrix.os == 'ubuntu-latest' && matrix.node == 22
        run: pnpm test:coverage

      - name: Build
        run: pnpm build

      - name: Verify the built package can be consumed
        run: pnpm smoke

      # Runs on one configuration because it installs several TypeScript releases from the registry.
      - name: Verify consumers across TypeScript versions
        if: matrix.os == 'ubuntu-latest' && matrix.node == 22
        run: pnpm test:consumer
